name: Publish Static Server Image

# Self-contained server (LUPINE_STATIC_DEPS=ON): nghttp2/libstdc++/libgcc
# linked in statically, glibc the only runtime dependency. The regular server
# image inherits nvidia/cuda:*-runtime purely to satisfy the loader, which is
# several GB for a binary that needs almost none of it -- libcuda and
# libnvidia-ml come from the host via nvidia-container-runtime, not from the
# image. This lane ships the same binary on a minimal base instead.
#
# Builder base is rockylinux8 across the whole matrix -- glibc 2.28 is the
# lowest floor NVIDIA publishes devel images for (11.7-13.1, amd64+arm64),
# and the binary runs only on glibc >= its builder's. MAX_GLIBC pins that
# floor and the in-build verifier fails on accidental raises. GCC_TOOLSET
# supplies a newer host compiler where nvcc requires one; -static-libstdc++
# keeps its libstdc++ delta out of the runtime requirements, so the floor
# stays 2.28.
#
# Unlike the client lane, no OpenSSL is built: the server is plaintext by
# design (front it with a TLS proxy).

on:
  release:
    types: [published]
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Static server CUDA ${{ matrix.cuda.version }} / ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cuda:
          # gcc_toolset: empty = the rocky8 system gcc 8.5 (accepted by nvcc
          # 11.x/12.x); CUDA 13 requires a newer host compiler.
          - version: 13.1.0
            gcc_toolset: gcc-toolset-13
          - version: 13.0.2
            gcc_toolset: gcc-toolset-13
          - version: 12.9.1
            gcc_toolset: ""
          - version: 12.8.1
            gcc_toolset: ""
          - version: 12.6.2
            gcc_toolset: ""
          - version: 12.5.1
            gcc_toolset: ""
          - version: 12.4.1
            gcc_toolset: ""
          - version: 11.8.0
            gcc_toolset: ""
          - version: 11.7.1
            gcc_toolset: ""
        platform:
          - arch: amd64
            docker_platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            docker_platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup /usr/share/swift
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: image-tags
        run: |
          set -euo pipefail
          {
            echo 'static<<EOF'
            echo 'ghcr.io/${{ github.repository_owner }}/lupine-server-static:cuda-${{ matrix.cuda.version }}-${{ matrix.platform.arch }}'
            if [ '${{ github.event_name }}' = 'release' ]; then
              echo 'ghcr.io/${{ github.repository_owner }}/lupine-server-static:${{ github.event.release.tag_name }}-cuda-${{ matrix.cuda.version }}-${{ matrix.platform.arch }}'
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish static server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: server-static
          platforms: ${{ matrix.platform.docker_platform }}
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            CUDA_VERSION=${{ matrix.cuda.version }}
            MAX_GLIBC=2.28
            GCC_TOOLSET=${{ matrix.cuda.gcc_toolset }}
          tags: ${{ steps.image-tags.outputs.static }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  publish:
    name: Publish static server manifest CUDA ${{ matrix.cuda.version }}
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cuda:
          - version: 13.1.0
          - version: 13.0.2
          - version: 12.9.1
          - version: 12.8.1
          - version: 12.6.2
          - version: 12.5.1
          - version: 12.4.1
          - version: 11.8.0
          - version: 11.7.1

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish static server manifest
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/lupine-server-static:cuda-${{ matrix.cuda.version }}"
          docker buildx imagetools create \
            --tag "${image}" \
            "${image}-amd64" \
            "${image}-arm64"
          if [ '${{ github.event_name }}' = 'release' ]; then
            release_image="ghcr.io/${{ github.repository_owner }}/lupine-server-static:${{ github.event.release.tag_name }}-cuda-${{ matrix.cuda.version }}"
            docker buildx imagetools create \
              --tag "${release_image}" \
              "${release_image}-amd64" \
              "${release_image}-arm64"
          fi